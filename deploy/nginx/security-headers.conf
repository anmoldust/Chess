# Security headers, included at the server level and re-included in any location that
# declares its own add_header (nginx does not inherit add_header once a location sets one).
#
# HSTS is safe: the domain is HTTPS-only (Cloudflare "Always Use HTTPS"). The CSP allows the
# Stockfish WASM worker (worker-src blob: / wasm-unsafe-eval) and the same-origin WSS socket.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; worker-src 'self' blob:; font-src 'self' data:; base-uri 'self'; frame-ancestors 'self'" always;
