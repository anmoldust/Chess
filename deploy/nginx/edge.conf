# Production edge for CCMMD: origin TLS, reverse proxy + upstream load balancer, and the SPA host.
# Adapted from infra/nginx.conf (the development SPA proxy). Cloudflare terminates viewer TLS;
# this is the origin leg and runs in Full (strict) mode against the Cloudflare Origin Certificate.

# The gateway is stateless (sessions live in Redis), so more replicas can be added here with a
# one-line change. game-service is deliberately NOT behind this upstream: it holds an in-memory
# STOMP broker and must stay a single replica until a broker relay is added.
upstream api_gateway {
    least_conn;
    server api-gateway:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Belt-and-braces with auth-service's in-memory login limiter: cap auth traffic per client IP.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# Plain HTTP is only ever a redirect; Cloudflare "Always Use HTTPS" already forces this at the edge.
# /healthz is served here so the container health check does not have to follow the TLS redirect.
server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # --- API: session/CSRF-scoped and WebSocket-consistent, so it is never cached -------------
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # --- WebSocket: the STOMP handshake fails without the Upgrade/Connection headers ----------
    location /ws {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Static: Vite content-hashes filenames, so these are safe to cache for a year ----------
    # `expires` (not add_header) so the server-level security headers above still apply.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Stockfish engine + WASM: large, pinned by filename (-16-), rarely changes.
    location /stockfish/ {
        expires 30d;
        try_files $uri =404;
    }

    # index.html must always revalidate so a new deploy is picked up immediately.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
