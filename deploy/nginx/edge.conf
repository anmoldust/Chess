# Production edge for CCMMD: reverse proxy + upstream load balancer and the SPA host.
#
# TLS is terminated by the hosting provider's proxy in front of this container, which connects
# here over plain HTTP on port 80. This server therefore listens on 80 only, and forwards the
# provider's X-Forwarded-Proto unchanged so the gateway still sees https and marks cookies
# Secure. To move to origin TLS (e.g. Cloudflare Full (strict)), re-add a 443 server using
# /etc/nginx/certs/origin.pem and mount the pair from deploy/secrets/.

# The provider sends X-Forwarded-Proto: https. A direct hit (no header) falls back to $scheme,
# which keeps local `docker compose` testing honest.
map $http_x_forwarded_proto $ccmmd_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# The gateway is stateless (sessions live in Redis), so more replicas can be added here with a
# one-line change. game-service is deliberately NOT behind this upstream: it holds an in-memory
# STOMP broker and must stay a single replica until a broker relay is added.
upstream api_gateway {
    least_conn;
    server api-gateway:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Belt-and-braces with auth-service's in-memory login limiter: cap auth traffic per client IP.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # Container health check: no logging, no proxying.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # --- API: session/CSRF-scoped and WebSocket-consistent, so it is never cached -------------
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ccmmd_forwarded_proto;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ccmmd_forwarded_proto;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # --- WebSocket: the STOMP handshake fails without the Upgrade/Connection headers ----------
    location /ws {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ccmmd_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Static: Vite content-hashes filenames, so these are safe to cache for a year ----------
    # `expires` (not add_header) so the server-level security headers above still apply.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Stockfish engine + WASM: large, pinned by filename (-16-), rarely changes.
    location /stockfish/ {
        expires 30d;
        try_files $uri =404;
    }

    # index.html must always revalidate so a new deploy is picked up immediately.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
