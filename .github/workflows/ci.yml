name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend — build and test every module
    runs-on: ubuntu-latest

    # The gateway and presence tests exercise real Redis, so it has to exist. Everything else
    # uses H2; the broker is only dialled lazily, but having it here keeps the suites uniform.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13
        env:
          RABBITMQ_DEFAULT_USER: chess
          RABBITMQ_DEFAULT_PASS: chess
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s
          --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # chesslib resolves from JitPack; the first build is the slow one.
      - name: Build and test
        run: mvn -B --no-transfer-progress test
      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  frontend:
    name: frontend — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --include=dev explicitly: a NODE_ENV=production in the environment otherwise makes npm
      # skip vite/tsc and the build fails for a reason that has nothing to do with the code.
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The composed stack is deliberately NOT built here. Nine Maven builds plus nine JVMs is slow
  # and exceeds a hosted runner's memory; run scripts/e2e.ps1 locally against `docker compose up`.
  compose-config:
    name: infra — compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml config --quiet
