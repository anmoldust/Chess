server:
  port: 8080

spring:
  application:
    name: chess-backend
  datasource:
    url: jdbc:h2:mem:chessdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173"
