# Tests run against in-memory H2 but execute the real Flyway migrations and let Hibernate
# `validate` the entity mappings against them — so a migration that drifts from its entity
# fails the build rather than production.
server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    # No broker is available in unit tests; connections are lazy, so nothing dials out unless
    # a test actually publishes and relays.
    host: localhost
    port: 5672
    username: chess
    password: chess

ccmmd:
  auth:
    jwt:
      issuer: ccmmd-auth
      ttl: PT15M
      key-path: ${java.io.tmpdir}/ccmmd-auth-test-rsa.pem
    internal-token: test-internal-token
    login:
      # Tests sign in many times from one context; the limiter has its own unit test.
      max-attempts: 1000
      window: PT5M
    reset:
      # The test needs the raw token to exercise redemption; production never sets this.
      expose-token: true
      ttl: PT30M
  messaging:
    outbox:
      # `fixedDelay` fires once immediately at startup and only then waits, so delaying the
      # initial run is what actually keeps the relay out of the tests. Without this it dials the
      # broker (or fails to) mid-test and mutates the very outbox rows the tests assert on.
      relay-initial-delay-ms: 3600000
      relay-delay-ms: 3600000
