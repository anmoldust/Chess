server:
  port: 8084

spring:
  application:
    name: matchmaking-service
  datasource:
    url: jdbc:postgresql://localhost:5433/matchmaking_db
    username: matchmaking_svc
    password: matchmaking_svc
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: chess
    password: chess

management:
  endpoints:
    web:
      exposure:
        include: health,info

ccmmd:
  security:
    jwks-uri: ${CCMMD_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ccmmd-auth
  matchmaking:
    interval-ms: 1000
    initial-delay-ms: 2000
    max-pairs-per-tick: 25
