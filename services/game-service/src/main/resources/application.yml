server:
  port: 8082

spring:
  application:
    name: game-service
  datasource:
    url: jdbc:postgresql://localhost:5433/game_db
    username: game_svc
    password: game_svc
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: chess
    password: chess
    listener:
      simple:
        # A poison engine reply must land in the DLQ, not be requeued forever.
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

ccmmd:
  security:
    jwks-uri: ${CCMMD_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ccmmd-auth
    # Games stay watchable without an account, exactly as before the split. Writes are NOT
    # opened here — they need a token, and the service layer decides ownership from it.
    public-paths: "GET:/api/games,GET:/api/games/**,/ws/**"
