# Observability stack for CCMMD: Prometheus + Grafana for metrics, ELK for logs.
#
# Runs as its own compose project (ccmmd-mon) so it can be restarted or removed without touching
# the application stack, while still sharing the application's docker network so Prometheus can
# scrape actuator endpoints and the edge can reach Grafana.
#
#   docker compose -p ccmmd-mon --env-file deploy/.env.production \
#       -f infra/docker-compose.monitoring.yml up -d
#
# Memory is deliberately tight: this host has 10 GiB total and the application stack already uses
# ~3.4 GiB. Elasticsearch runs with a 768 MB heap and a hard 1.8 GB limit.
name: ccmmd-mon

x-defaults: &defaults
  restart: unless-stopped
  networks: [chess]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  elasticsearch:
    <<: *defaults
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      # The only clients are on the private docker network; the edge never proxies to it.
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms768m -Xmx768m"
      bootstrap.memory_lock: "false"
      ingest.geoip.downloader.enabled: "false"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    mem_limit: 1800m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s

  logstash:
    <<: *defaults
    image: docker.elastic.co/logstash/logstash:8.15.3
    environment:
      LS_JAVA_OPTS: "-Xms384m -Xmx384m"
      # One worker and a small batch: three vCPUs are shared with nine JVMs.
      pipeline.workers: "1"
      pipeline.batch.size: "125"
      pipeline.batch.delay: "50"
      xpack.monitoring.enabled: "false"
    volumes:
      - ./monitoring/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    mem_limit: 900m
    depends_on:
      elasticsearch: { condition: service_healthy }

  kibana:
    <<: *defaults
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "1b7a1f0d2e3c4b5a6f708192a3b4c5d6"
      SERVER_HOST: "0.0.0.0"
    # Loopback only: reach it with `ssh -L 5601:localhost:5601 anmol`. Never exposed publicly.
    ports:
      - "127.0.0.1:5601:5601"
    mem_limit: 700m
    depends_on:
      elasticsearch: { condition: service_healthy }

  filebeat:
    <<: *defaults
    image: docker.elastic.co/beats/filebeat:8.15.3
    user: root
    command: ["filebeat", "-e", "-strict.perms=false"]
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeatdata:/usr/share/filebeat/data
    mem_limit: 300m
    depends_on: [logstash]

  prometheus:
    <<: *defaults
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=8GB
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    mem_limit: 700m

  node-exporter:
    <<: *defaults
    image: prom/node-exporter:v1.8.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    mem_limit: 120m

  cadvisor:
    <<: *defaults
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 400m

  redis-exporter:
    <<: *defaults
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 100m

  postgres-exporter:
    <<: *defaults
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable
    mem_limit: 100m

  grafana:
    <<: *defaults
    image: grafana/grafana:11.2.0
    environment:
      # Served under /grafana/ by the edge, hence the sub-path settings.
      GF_SERVER_ROOT_URL: https://fulldeveloper.duckdns.org/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    mem_limit: 500m

networks:
  chess:
    external: true
    name: ccmmd-prod_chess

volumes:
  esdata:
  promdata:
  grafanadata:
  filebeatdata:
