# Logstash pipeline: Beats -> (parse) -> Elasticsearch.
#
# The services log through docker's json-file driver, so every line arrives as a JSON envelope with
# a "log" field holding the real message. Filebeat's container input already decodes that wrapper
# and attaches container metadata; this pipeline normalises names and indexes by day.
input {
  beats {
    port => 5044
  }
}

filter {
  # Drop the vast, low-value noise from health probes before it reaches the index.
  if [message] =~ /"GET \/actuator\/health/ {
    drop {}
  }

  # Spring Boot writes "2026-11-09T19:29:54.123Z  INFO 1 --- [auth-service] ..." — lift level/logger.
  grok {
    match => {
      "message" => [
        "%{TIMESTAMP_ISO8601:spring_time}\s+%{LOGLEVEL:level}\s+%{NUMBER:pid}\s+---\s+\[\s*%{DATA:thread}\]\s+%{DATA:logger}\s+:\s+%{GREEDYDATA:message}"
      ]
    }
    overwrite => ["message"]
    tag_on_failure => []
  }

  date {
    match => ["spring_time", "ISO8601"]
    target => "@timestamp"
    tag_on_failure => []
  }

  mutate {
    remove_field => ["spring_time", "pid", "agent", "ecs", "input", "host"]
    add_field => { "app" => "ccmmd" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ccmmd-logs-%{+YYYY.MM.dd}"
    # Keep the mapping stable across daily indices instead of letting ES guess per index.
    template_name => "ccmmd-logs"
    template_overwrite => false
  }
  # Uncomment while tuning the pipeline:
  # stdout { codec => rubydebug }
}
