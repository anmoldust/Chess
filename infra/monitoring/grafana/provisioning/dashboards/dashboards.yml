# Loads every dashboard JSON found in the mounted folder, so dashboards are versioned in git.
apiVersion: 1

providers:
  - name: ccmmd
    orgId: 1
    folder: CCMMD
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
